<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Not Found — Coming Soon | CIS 295</title>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2c5367;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
      }

      main {
        width: min(100%, 34rem);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2rem;
      }

      .status {
        margin: 0 0 0.25rem;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.6rem;
        line-height: 1.25;
      }

      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        font-weight: 600;
        text-underline-offset: 0.15em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>Not found &mdash; coming soon</h1>
      <p>
        This project page has not been deployed yet, or the address may have a
        typo. Check back later in the term as weekly projects go live.
      </p>
      <p><a href="/">Return to the CIS 295 Class Directory</a></p>
    </main>
  </body>
</html>
